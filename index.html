<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Callango Nerd — Cultura pop, games, cinema e tecnologia</title>
<meta name="description" content="Portal Callango Nerd: notícias, críticas e análises de cinema, séries, games, quadrinhos e tecnologia.">
<meta property="og:title" content="Callango Nerd">
<meta property="og:description" content="Cultura pop, games, cinema e tecnologia.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#fff}
body{font-family:"Google Sans","Segoe UI",Roboto,Arial,sans-serif}
</style>
<script>
(function(){
  var p = location.pathname;
  var base = p.replace(/index\.html$/,"").replace(/\/admin\/?$/,"/").replace(/[^/]*$/,"");
  if(!/\/$/.test(base)) base += "/";
  window.CN_BASE = base;
  window.CN_rest = function(){
    var r = decodeURIComponent(location.pathname).slice(base.length).replace(/^\/+/,"").replace(/index\.html$/,"");
    return r.replace(/\/+$/,"");
  };
  window.CN_isAdminRoute = function(){ return false; };
})();
</script>
</head>
<body>
<!-- ================= SITE PÚBLICO (v14) ================= -->
<div id="publicSite" aria-live="polite"></div>

<style>
#publicSite{--pbrand:#d93025;--pink:#111;--pmuted:#6b7280;--pline:#e6e8eb;background:#fff;color:#111;
  font-family:"Google Sans","Segoe UI",Roboto,Arial,sans-serif}
#publicSite *{box-sizing:border-box}
.ps-wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.ps-top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--pline)}
.ps-top .ps-wrap{display:flex;align-items:center;gap:14px;height:66px}
.ps-logo{font-weight:900;font-size:22px;letter-spacing:.5px;text-decoration:none;color:#111;white-space:nowrap}
.ps-logo em{color:var(--pbrand);font-style:normal}
.ps-logo img{height:38px;display:block}
.ps-nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.ps-nav a{padding:8px 12px;border-radius:999px;text-decoration:none;color:#374151;font-weight:600;font-size:14px}
.ps-nav a:hover,.ps-nav a.active{background:rgba(217,48,37,.10);color:var(--pbrand)}
.ps-search{display:flex;align-items:center;gap:8px;border:1px solid var(--pline);border-radius:999px;padding:6px 12px;background:#f7f8fa}
.ps-search input{border:0;background:transparent;outline:0;font-size:14px;width:170px;padding:2px}
.ps-admin{font-size:12px;color:var(--pmuted);text-decoration:none;border:1px solid var(--pline);border-radius:999px;padding:6px 10px}
.ps-hero{margin:22px 0 8px;position:relative;border-radius:18px;overflow:hidden;background:#111;min-height:320px}
.ps-slide{display:none;position:relative;min-height:320px}
.ps-slide.on{display:block}
.ps-slide img{width:100%;height:420px;object-fit:cover;opacity:.62}
.ps-slide .ps-cap{position:absolute;left:0;right:0;bottom:0;padding:26px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.85))}
.ps-slide h2{color:#fff;font-size:clamp(20px,3.4vw,34px);margin:8px 0 6px;line-height:1.18}
.ps-slide p{color:#e5e7eb;margin:0;max-width:760px;font-size:15px}
.ps-slide a{text-decoration:none}
.ps-tag{display:inline-block;background:var(--pbrand);color:#fff;font-size:11px;font-weight:800;letter-spacing:.6px;
  text-transform:uppercase;padding:5px 10px;border-radius:999px}
.ps-dots{position:absolute;right:18px;bottom:16px;display:flex;gap:7px;z-index:3}
.ps-dots button{width:9px;height:9px;border-radius:50%;border:0;background:rgba(255,255,255,.45);cursor:pointer;padding:0}
.ps-dots button.on{background:#fff;width:22px}
.ps-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;border:0;background:rgba(0,0,0,.45);color:#fff;
  width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
.ps-arrow.l{left:12px}.ps-arrow.r{right:12px}
.ps-chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.ps-chips a{border:1px solid var(--pline);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;
  text-decoration:none;color:#374151;background:#fff}
.ps-chips a.on{background:#111;color:#fff;border-color:#111}
.ps-h3{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#111;
  border-left:4px solid var(--pbrand);padding-left:10px;margin:26px 0 14px}
.ps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.ps-card{border:1px solid var(--pline);border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column;
  transition:transform .16s,box-shadow .16s}
.ps-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(15,23,42,.12)}
.ps-card .ps-thumb{height:168px;background:#eef0f3 center/cover no-repeat;display:block}
.ps-card .ps-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.ps-card h4{margin:0;font-size:17px;line-height:1.3}
.ps-card h4 a{color:#111;text-decoration:none}
.ps-card h4 a:hover{color:var(--pbrand)}
.ps-card p{margin:0;color:var(--pmuted);font-size:14px;flex:1}
.ps-meta{font-size:12px;color:var(--pmuted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ps-cat{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--pbrand)}
.ps-empty{border:1px dashed var(--pline);border-radius:14px;padding:34px;text-align:center;color:var(--pmuted)}
.ps-article{max-width:780px;margin:26px auto 0}
.ps-article h1{font-size:clamp(24px,4vw,38px);line-height:1.2;margin:10px 0}
.ps-article .ps-cover{width:100%;border-radius:16px;margin:16px 0;display:block}
.ps-content{font-size:17px;line-height:1.75;color:#1f2937}
.ps-content img{max-width:100%;border-radius:12px}
.ps-content h2,.ps-content h3{line-height:1.3;margin-top:26px}
.ps-back{display:inline-block;margin:6px 0 0;font-size:14px;color:var(--pbrand);text-decoration:none;font-weight:700}
.ps-foot{margin-top:46px;border-top:1px solid var(--pline);background:#fafbfc;padding:26px 0;color:var(--pmuted);font-size:13px}
.ps-foot .ps-wrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.ps-foot a{color:var(--pmuted)}
.ps-note{font-size:12px;color:var(--pmuted);margin-top:6px}
@media(max-width:760px){.ps-search{display:none}.ps-slide img{height:300px}.ps-top .ps-wrap{height:auto;padding:10px 18px;flex-wrap:wrap}}
</style>

<script>
/* ============ CALLANGO NERD — FRONTEND PÚBLICO v14 ============
   Home pública em "/", painel CMS em "#/admin".
   Dados: posts.json + site-config.json do repositório (GitHub Pages),
   com fallback para o cache local do painel.                        */
(function(){

  const root = document.getElementById("publicSite");
  const E = s => String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sl = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  const dt = d => { try{ return new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"}); }catch{ return ""; } };
  const strip = h => String(h||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();

  let CFG = {site:{name:"Callango Nerd"},menus:[],categories:[]};
  let POSTS = [];

  /* ---------- caminhos possíveis dos arquivos publicados ---------- */
  function dataDirs(){
    let dir = "";
    try{ dir = (JSON.parse(localStorage.getItem("callango_cms_v2")||"{}").cfg||{}).ghDir || ""; }catch{}
    const base = location.pathname.replace(/[^/]*$/,"");
    const dirs = ["", "data/", "docs/", "public/", "content/"];
    if(dir) dirs.unshift(dir.replace(/^\/+|\/+$/g,"")+"/");
    const out = [];
    dirs.forEach(d=>{ const p = base+d; if(!out.includes(p)) out.push(p); });
    if(!out.includes("/")) out.push("/");
    return out;
  }
  async function grab(name){
    for(const b of dataDirs()){
      try{
        const r = await fetch(b+name, {cache:"no-store"});
        if(!r.ok) continue;
        const t = await r.text();
        if(/^\s*</.test(t)) continue;           // veio HTML (404 do Pages)
        const j = JSON.parse(t);
        if(j) return j;
      }catch{}
    }
    return null;
  }

  /* ---------- normalização: aceita qualquer formato vindo do backup ---------- */
  function firstImg(html){
    const m = /<img[^>]+src=["']([^"']+)["']/i.exec(String(html||""));
    return m ? m[1] : "";
  }
  function normalize(p){
    if(!p || typeof p !== "object") return null;
    const title = p.title || p.titulo || p.name || "";
    if(!title) return null;
    const content = p.content || p.html || p.body || p.contentHtml || p.description || "";
    const status = String(p.status||"published").toLowerCase();
    if(p.trashed || (status && status!=="published" && status!=="publicado" && status!=="live")) return null;
    const tags = Array.isArray(p.tags) ? p.tags
      : Array.isArray(p.labels) ? p.labels
      : String(p.tags||p.labels||"").split(",").map(s=>s.trim()).filter(Boolean);
    return {
      id: p.id || p.slug || sl(title),
      title,
      slug: p.slug || p.permalink || sl(title),
      category: p.category || p.categoria || tags[0] || "",
      tags,
      cover: p.cover || p.image || p.thumbnail || p.thumb || firstImg(content),
      excerpt: p.excerpt || p.summary || p.resumo || strip(content).slice(0,180),
      content,
      author: p.author || p.authorName || p.autor || "",
      publishedAt: p.publishedAt || p.published || p.date || p.updated || p.createdAt || "",
      featured: p.featured==="yes" || p.featured===true
    };
  }
  function unwrap(data){
    if(!data) return [];
    if(Array.isArray(data)) return data;
    if(Array.isArray(data.posts)) return data.posts;
    if(Array.isArray(data.items)) return data.items;
    if(Array.isArray(data.entries)) return data.entries;
    if(data.data && Array.isArray(data.data)) return data.data;
    return [];
  }

  /* ---------- fallback: Firestore (REST, leitura pública) ---------- */
  function fbCfg(cfg){
    const c = (cfg && (cfg.firebase || cfg.firestore)) || window.CN_FIREBASE || null;
    if(c && c.projectId && c.apiKey) return c;
    try{
      const l = (JSON.parse(localStorage.getItem("callango_cms_v2")||"{}").cfg)||{};
      if(l.projectId && l.apiKey) return l;
    }catch{}
    return null;
  }
  function fsVal(v){
    if(!v || typeof v!=="object") return v;
    if("stringValue" in v) return v.stringValue;
    if("integerValue" in v) return Number(v.integerValue);
    if("doubleValue" in v) return Number(v.doubleValue);
    if("booleanValue" in v) return v.booleanValue;
    if("timestampValue" in v) return v.timestampValue;
    if("nullValue" in v) return "";
    if("arrayValue" in v) return (v.arrayValue.values||[]).map(fsVal);
    if("mapValue" in v) return fsObj(v.mapValue.fields||{});
    return "";
  }
  function fsObj(fields){
    const o = {}; Object.keys(fields||{}).forEach(k=>o[k]=fsVal(fields[k])); return o;
  }
  async function fromFirestore(cfg){
    const c = fbCfg(cfg);
    if(!c) return {cfg:null, posts:[]};
    const db = encodeURIComponent(c.firestoreDb||"(default)");
    const base = `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(c.projectId)}/databases/${db}/documents`;
    const key = `key=${encodeURIComponent(c.apiKey)}`;
    let posts = [], conf = null;

    // 1) coleção "posts" publicada
    try{
      const r = await fetch(`${base}/posts?pageSize=300&${key}`, {cache:"no-store"});
      if(r.ok){
        const j = await r.json();
        posts = (j.documents||[]).map(d=>fsObj(d.fields));
      }
    }catch{}

    // 2) documento de estado do painel (cms/state)
    try{
      const col = encodeURIComponent(c.firestoreCollection||"cms");
      const doc = encodeURIComponent(c.firestoreDoc||"state");
      const r = await fetch(`${base}/${col}/${doc}?${key}`, {cache:"no-store"});
      if(r.ok){
        const j = await r.json();
        const o = fsObj(j.fields||{});
        let state = o;
        if(typeof o.json === "string"){ try{ state = JSON.parse(o.json); }catch{} }
        else if(typeof o.data === "string"){ try{ state = JSON.parse(o.data); }catch{} }
        if(state && Array.isArray(state.posts) && !posts.length) posts = state.posts;
        if(state && (state.cfg || state.categories || state.menus)){
          const k = state.cfg || {};
          conf = {
            site:{name:k.siteName||"Callango Nerd",logo:k.logo||"",seoDesc:k.seoDesc||"",perPage:Number(k.perPage)||12},
            menus: state.menus||[],
            categories:(state.categories||[]).map(x=>({name:x.name,slug:x.slug||sl(x.name)}))
          };
        }
      }
    }catch{}

    return {cfg:conf, posts};
  }

  /* ---------- fallback: cache local do painel ---------- */
  function fromCache(){
    let db=null; try{ db=JSON.parse(localStorage.getItem("callango_cms_v2")||"null"); }catch{}
    if(!db) return {cfg:null,posts:[]};
    const c = db.cfg||{};
    const posts = (db.posts||[]).filter(p=>!p.trashed && p.status==="published").map(p=>({
      id:p.id,title:p.title,slug:p.slug||sl(p.title),category:p.category||"",tags:p.tags||[],cover:p.cover||"",
      excerpt:p.excerpt||"",content:p.content||"",author:p.authorName||p.author||"",
      publishedAt:p.publishedAt||p.createdAt,featured:p.featured==="yes"||p.featured===true
    }));
    const cfg = {
      site:{name:c.siteName||"Callango Nerd",logo:c.logo||"",seoDesc:c.seoDesc||"",perPage:Number(c.perPage)||12},
      menus:db.menus||[],
      categories:(db.categories||[]).map(x=>({name:x.name,slug:x.slug||sl(x.name)}))
    };
    return {cfg,posts};
  }

  function finish(cfg, rawPosts){
    CFG = cfg || CFG;
    const seen = new Set();
    POSTS = unwrap(rawPosts).map(normalize).filter(Boolean).filter(p=>{
      const k = p.slug || p.id; if(seen.has(k)) return false; seen.add(k); return true;
    }).sort((a,b)=>{
      const ta = Date.parse(a.publishedAt)||0, tb = Date.parse(b.publishedAt)||0;
      return tb - ta || String(b.publishedAt).localeCompare(String(a.publishedAt));
    });
    render();
  }

  async function boot(){
    root.innerHTML = shell(`<div class="ps-empty">Carregando o acervo do Callango Nerd…</div>`);
    let cfg = null, posts = null;
    try{
      const res = await Promise.all([grab("site-config.json"), grab("posts.json")]);
      cfg = res[0]; posts = res[1];
    }catch{}

    let list = unwrap(posts);

    // sem posts.json publicado? tenta Firestore e depois o cache do painel
    if(!list.length){
      const fs = await fromFirestore(cfg);
      if(fs.posts.length){ list = fs.posts; }
      cfg = cfg || fs.cfg;
    }
    if(!list.length){
      const cache = fromCache();
      list = cache.posts;
      cfg = cfg || cache.cfg;
    }
    finish(cfg, list);
  }

  /* ---------- roteador por hash ---------- */
  function route(){
    const h = decodeURIComponent(String(location.hash||"").replace(/^#\/?/,""));
    const parts = (h ? h : (window.CN_rest?window.CN_rest():"")).split("/").filter(Boolean);
    if(!parts.length) return {v:"home"};
    const [a,b] = parts;
    if(a==="post"||a==="p") return {v:"post",slug:b||""};
    if(a==="categoria"||a==="c") return {v:"cat",slug:b||""};
    if(a==="busca"||a==="s") return {v:"search",q:decodeURIComponent(b||"")};
    return {v:"post",slug:a};
  }

  /* URLs limpas: "#/post/slug" vira "/slug" com History API */
  function toPath(href){
    const h = decodeURIComponent(String(href||"").replace(/^#\/?/,""));
    const [a,b] = h.split("/");
    const B = window.CN_BASE || "/";
    if(!a) return B;
    if(a==="post"||a==="p") return B + encodeURIComponent(b||"");
    if(a==="categoria"||a==="c") return B + "categoria/" + encodeURIComponent(b||"");
    if(a==="busca"||a==="s") return B + "busca/" + encodeURIComponent(b||"");
    return B;
  }
  window.CNgo = function(href){
    try{ history.pushState({}, "", toPath(href)); }catch{ location.hash = href; return; }
    render(); window.scrollTo(0,0);
  };
  document.addEventListener("click", ev=>{
    const a = ev.target.closest && ev.target.closest('#publicSite a[href^="#/"]');
    if(!a || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button) return;
    ev.preventDefault(); window.CNgo(a.getAttribute("href"));
  });
  window.addEventListener("popstate", ()=>render());

  const cats = () => {
    const map = new Map();
    (CFG.categories||[]).forEach(c=>map.set(c.slug||sl(c.name), c.name));
    POSTS.forEach(p=>{ if(p.category) map.set(sl(p.category), p.category); });
    return [...map].map(([slug,name])=>({slug,name}));
  };

  function shell(inner, activeCat){
    const s = CFG.site||{};
    const menu = (CFG.menus||[]).filter(m=>m&&(m.label||m.name));
    const nav = (menu.length ? menu.map(m=>{
        const label=m.label||m.name; const u=m.url||m.href||"";
        const local = /^#|^\//.test(u) || !u;
        const target = local ? ("#/categoria/"+sl(label)) : u;
        return `<a href="${E(target)}"${local?"":' target="_blank" rel="noopener"'}>${E(label)}</a>`;
      }).join("") : cats().slice(0,6).map(c=>`<a href="#/categoria/${E(c.slug)}"${activeCat===c.slug?' class="active"':''}>${E(c.name)}</a>`).join(""));
    const logo = s.logo ? `<img src="${E(s.logo)}" alt="${E(s.name||"Callango Nerd")}">`
                        : `CALLANGO <em>NERD</em>`;
    return `
    <header class="ps-top"><div class="ps-wrap">
      <a class="ps-logo" href="#/">${logo}</a>
      <nav class="ps-nav">${nav}</nav>
      <form class="ps-search" onsubmit="return CNsearch(event)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#6b7280"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L19 20.49 20.49 19zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/></svg>
        <input id="psQ" placeholder="Buscar no acervo" aria-label="Buscar">
      </form>
    </div></header>
    <main class="ps-wrap">${inner}</main>
    <footer class="ps-foot"><div class="ps-wrap">
      <div>© ${new Date().getFullYear()} ${E((CFG.site||{}).name||"Callango Nerd")} — ${E((CFG.site||{}).seoDesc||"cultura pop, games e tecnologia")}</div>
      <div><a href="feed.xml">RSS</a> · <a href="sitemap.xml">Sitemap</a></div>
    </div></footer>`;
  }

  function card(p){
    const cover = p.cover ? `background-image:url('${E(p.cover)}')` : "";
    const ex = p.excerpt || strip(p.content).slice(0,150);
    return `<article class="ps-card">
      <a class="ps-thumb" style="${cover}" href="#/post/${E(p.slug)}" aria-label="${E(p.title)}"></a>
      <div class="ps-body">
        ${p.category?`<span class="ps-cat">${E(p.category)}</span>`:""}
        <h4><a href="#/post/${E(p.slug)}">${E(p.title)}</a></h4>
        <p>${E(ex)}${ex.length>=150?"…":""}</p>
        <div class="ps-meta">${p.author?`<span>${E(p.author)}</span>·`:""}<span>${E(dt(p.publishedAt))}</span></div>
      </div></article>`;
  }

  function hero(list){
    if(!list.length) return "";
    const slides = list.map((p,i)=>`
      <div class="ps-slide${i===0?" on":""}">
        ${p.cover?`<img src="${E(p.cover)}" alt="${E(p.title)}">`:`<div style="height:420px;background:linear-gradient(135deg,#111,#7f1d1d)"></div>`}
        <div class="ps-cap">
          ${p.category?`<span class="ps-tag">${E(p.category)}</span>`:""}
          <h2><a href="#/post/${E(p.slug)}" style="color:#fff">${E(p.title)}</a></h2>
          <p>${E(p.excerpt||strip(p.content).slice(0,160))}</p>
        </div></div>`).join("");
    const dots = list.map((_,i)=>`<button class="${i===0?"on":""}" onclick="CNslide(${i})" aria-label="Slide ${i+1}"></button>`).join("");
    return `<section class="ps-hero" id="psHero">
      ${slides}
      <button class="ps-arrow l" onclick="CNslide(-1,true)" aria-label="Anterior">‹</button>
      <button class="ps-arrow r" onclick="CNslide(1,true)" aria-label="Próximo">›</button>
      <div class="ps-dots">${dots}</div></section>`;
  }

  let slideAt=0, timer=null;
  window.CNslide = function(n, rel){
    const wrap=document.getElementById("psHero"); if(!wrap) return;
    const items=[...wrap.querySelectorAll(".ps-slide")], dots=[...wrap.querySelectorAll(".ps-dots button")];
    slideAt = rel ? (slideAt+n+items.length)%items.length : ((n%items.length)+items.length)%items.length;
    items.forEach((el,i)=>el.classList.toggle("on", i===slideAt));
    dots.forEach((el,i)=>el.classList.toggle("on", i===slideAt));
    clearInterval(timer); timer=setInterval(()=>window.CNslide(1,true), 6500);
  };
  window.CNsearch = function(ev){
    ev.preventDefault();
    const q=(document.getElementById("psQ")||{}).value||"";
    window.CNgo(q.trim() ? "#/busca/"+encodeURIComponent(q.trim()) : "#/");
    return false;
  };

  function grid(list, empty){
    return list.length ? `<div class="ps-grid">${list.map(card).join("")}</div>`
      : `<div class="ps-empty">${E(empty||"Nenhum post publicado ainda.")}<div class="ps-note">Publique no painel e envie <code>posts.json</code> ao repositório.</div></div>`;
  }

  function render(){
    const r = route();
    const cs = cats();
    const chips = cs.length ? `<div class="ps-chips"><a href="#/" class="${r.v==="home"?"on":""}">Tudo</a>${
      cs.map(c=>`<a href="#/categoria/${E(c.slug)}" class="${r.v==="cat"&&r.slug===c.slug?"on":""}">${E(c.name)}</a>`).join("")}</div>` : "";

    if(r.v==="post"){
      const p = POSTS.find(x=>x.slug===r.slug) || POSTS.find(x=>sl(x.title)===r.slug);
      if(!p){ root.innerHTML = shell(`<div class="ps-empty">Post não encontrado.<div class="ps-note"><a class="ps-back" href="#/">← Voltar para a home</a></div></div>`); return; }
      const rel = POSTS.filter(x=>x.slug!==p.slug && (x.category===p.category)).slice(0,3);
      root.innerHTML = shell(`
        <article class="ps-article">
          <a class="ps-back" href="#/">← Voltar</a>
          ${p.category?`<div><span class="ps-cat">${E(p.category)}</span></div>`:""}
          <h1>${E(p.title)}</h1>
          <div class="ps-meta">${p.author?`<span>${E(p.author)}</span>·`:""}<span>${E(dt(p.publishedAt))}</span>
            ${(p.tags||[]).slice(0,5).map(t=>`<span>#${E(t)}</span>`).join(" ")}</div>
          ${p.cover?`<img class="ps-cover" src="${E(p.cover)}" alt="${E(p.title)}">`:""}
          <div class="ps-content">${p.content || `<p>${E(p.excerpt||"")}</p>`}</div>
        </article>
        ${rel.length?`<h3 class="ps-h3">Leia também</h3>${grid(rel)}`:""}`);
      document.title = p.title + " — " + ((CFG.site||{}).name||"Callango Nerd");
      window.scrollTo(0,0); return;
    }

    if(r.v==="cat"){
      const list = POSTS.filter(p=>sl(p.category||"")===r.slug);
      const name = (cs.find(c=>c.slug===r.slug)||{}).name || r.slug;
      root.innerHTML = shell(`${chips}<h3 class="ps-h3">${E(name)}</h3>${grid(list,"Nenhum post nesta categoria.")}`, r.slug);
      document.title = name + " — " + ((CFG.site||{}).name||"Callango Nerd");
      window.scrollTo(0,0); return;
    }

    if(r.v==="search"){
      const q = String(r.q||"").toLowerCase();
      const list = POSTS.filter(p=>(p.title+" "+(p.excerpt||"")+" "+(p.category||"")+" "+(p.tags||[]).join(" ")+" "+strip(p.content)).toLowerCase().includes(q));
      root.innerHTML = shell(`${chips}<h3 class="ps-h3">Resultados para “${E(r.q)}”</h3>${grid(list,"Nada encontrado.")}`);
      window.scrollTo(0,0); return;
    }

    const feat = POSTS.filter(p=>p.featured).slice(0,5);
    const carousel = feat.length ? feat : POSTS.slice(0,4);
    const rest = POSTS.filter(p=>!carousel.includes(p));
    const per = Number((CFG.site||{}).perPage)||12;
    root.innerHTML = shell(`
      ${hero(carousel)}
      ${chips}
      <h3 class="ps-h3">Últimas do acervo</h3>
      ${grid(POSTS.slice(0,per))}
      ${cs.slice(0,3).map(c=>{
        const l = POSTS.filter(p=>sl(p.category||"")===c.slug).slice(0,3);
        return l.length? `<h3 class="ps-h3">${E(c.name)}</h3>${grid(l)}` : "";
      }).join("")}`);
    document.title = ((CFG.site||{}).name||"Callango Nerd") + " — cultura pop, games e tecnologia";
    if(carousel.length>1){ slideAt=0; clearInterval(timer); timer=setInterval(()=>window.CNslide(1,true), 6500); }
  }

  window.addEventListener("hashchange", ()=>{
    render();
  });
  boot();
})();
</script>
</body>
</html>
